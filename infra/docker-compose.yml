version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: xhs-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xhs_bot
      POSTGRES_USER: xhs
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: xhs-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pg_data:
